name: Merge Plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Fetch stars and stamp added_date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in plugins/*.yml; do
            count=$(yq eval 'length' "$f")
            if [ "$count" = "0" ]; then continue; fi

            for i in $(seq 0 $(( count - 1 ))); do
              repo=$(yq eval ".[$i].repo" "$f")
              host=$(yq eval ".[$i].host // \"\"" "$f")

              if [ -z "$host" ] || [ "$host" = "github.com" ]; then
                stars=$(curl -s -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/$repo" | \
                  yq eval '.stargazers_count // 0' -)
              elif [ "$host" = "gitlab.com" ]; then
                encoded=$(echo "$repo" | sed 's/\//%2F/')
                stars=$(curl -s \
                  "https://gitlab.com/api/v4/projects/$encoded" | \
                  yq eval '.star_count // 0' -)
              else
                stars=0
              fi

              yq eval -i ".[$i].stars = $stars" "$f"

              # Stamp added_date for new entries.
              added_date=$(yq eval ".[$i].added_date // \"\"" "$f")
              if [ -z "$added_date" ]; then
                added_date=$(date +%Y-%m-%d)
                yq eval -i ".[$i].added_date = \"$added_date\"" "$f"
              fi
            done
          done

      - name: Build merged registry
        run: bash scripts/build_dist.sh

      - name: Generate README
        run: bash scripts/build_readme.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/plugins.yml README.md plugins/*.yml
          git diff --cached --quiet || git commit -m "ci: update registry and README"
          git push
